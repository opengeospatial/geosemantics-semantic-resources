name: Build & Deploy GeoSPARQL OGC Documents

on:
  push:
    branches: [main]
    paths:
      - "resources/geosparql-swg/index.html"
      - "resources/geosparql-swg/geosparql-geometry-datatypes/**"
      - "geosparql-1.1/source/alignments/**"
      - ".github/workflows/build-and-deploy-geosparql-docs.yml"
  pull_request:
    paths:
      - "resources/geosparql-swg/index.html"
      - "resources/geosparql-swg/geosparql-geometry-datatypes/**"
      - "geosparql-1.1/source/alignments/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages-geosparql-swg"
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      datatypes: ${{ steps.filter.outputs.datatypes }}
      alignments: ${{ steps.filter.outputs.alignments }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            datatypes:
              - 'resources/geosparql-swg/geosparql-geometry-datatypes/**'
            alignments:
              - 'geosparql-1.1/source/alignments/**'
            landing:
              - 'resources/geosparql-swg/index.html'

  build-datatypes:
    needs: changes
    if: needs.changes.outputs.datatypes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/geosparql-swg/geosparql-geometry-datatypes/standard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rdflib
      - run: python scripts/ttl_to_adoc.py
      - uses: actions-mn/setup@v3
        with:
          version: "1.17.0"
      - env:
          TEBAKO_METANORMA_VERSION: "1.17.0"
        run: metanorma compile -t ogc -x xml,html,pdf document.adoc --agree-to-terms
      - run: |
          mkdir -p _site/geosparql-geometry-datatypes
          cp document.html _site/geosparql-geometry-datatypes/index.html
          cp document.pdf _site/geosparql-geometry-datatypes/geosparql-geometry-datatypes.pdf
          cp document.xml _site/geosparql-geometry-datatypes/geosparql-geometry-datatypes.xml
      - uses: actions/upload-artifact@v4
        with:
          name: site-datatypes
          path: resources/geosparql-swg/geosparql-geometry-datatypes/standard/_site/

  build-alignments:
    needs: changes
    if: needs.changes.outputs.alignments == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geosparql-1.1/source/alignments/doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rdflib
      - run: python scripts/alignments_ttl_to_adoc.py
      - uses: actions-mn/setup@v3
        with:
          version: "1.17.0"
      - env:
          TEBAKO_METANORMA_VERSION: "1.17.0"
        run: metanorma compile -t ogc -x xml,html,pdf document.adoc --agree-to-terms
      - run: |
          mkdir -p _site/geosparql-alignments
          cp document.html _site/geosparql-alignments/index.html
          cp document.pdf _site/geosparql-alignments/geosparql-alignments.pdf
          cp document.xml _site/geosparql-alignments/geosparql-alignments.xml
      - uses: actions/upload-artifact@v4
        with:
          name: site-alignments
          path: geosparql-1.1/source/alignments/doc/_site/

  deploy:
    needs: [changes, build-datatypes, build-alignments]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.build-datatypes.result == 'success' || needs.build-datatypes.result == 'skipped') &&
      (needs.build-alignments.result == 'success' || needs.build-alignments.result == 'skipped') &&
      (needs.changes.outputs.datatypes == 'true' || needs.changes.outputs.alignments == 'true' || needs.changes.outputs.landing == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare merged site folder
        run: |
          mkdir -p _merged_site
          cp resources/geosparql-swg/index.html _merged_site/index.html
      - name: Download datatypes artifact (if built)
        if: needs.build-datatypes.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: site-datatypes
          path: _merged_site
      - name: Download alignments artifact (if built)
        if: needs.build-alignments.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: site-alignments
          path: _merged_site
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _merged_site
          keep_files: true
          commit_message: "Deploy GeoSPARQL SWG OGC Documents"
